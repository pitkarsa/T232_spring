spring.application.name=OrmDemo
spring.datasource.url=jdbc:mysql://localhost:3306/orm_demo
spring.datasource.username=root
spring.datasource.password=root
# defines ddl-auto mode, hadling DDL commands

#ddl-auto - 'update' for development - uses existing table, creates new if its not there 
#ddl-auto - 'none' for production - no structural changes in table allowed
spring.jpa.hibernate.ddl-auto=update

#optional properties - only in development
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true